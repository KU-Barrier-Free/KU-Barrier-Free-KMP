build:
  excludes: '**/build.gradle.kts'

complexity:
  LongMethod:
    threshold: 100
    ignoreAnnotated: [ 'Composable' ]
    excludes: [ '**/feature/mypage/**/MyPageNavigation.kt' ]
  CyclomaticComplexMethod:
    threshold: 40
    ignoreAnnotated: [ 'Composable' ]
    excludes: [ '**/feature/home/**/HomeViewModel.kt' ]
  LargeClass:
    excludes: [ '**/feature/home/**/HomeViewModel.kt', '**/feature/mypage/**/MyFeedViewModel.kt', '**/feature/home_detail/**/HomeDetailViewModel.kt' ]
  LongParameterList:
    active: false
  TooManyFunctions:
    active: false
  ComplexCondition:
    threshold: 7

performance:
  SpreadOperator:
    active: false

formatting:
  TrailingCommaOnCallSite:
    active: true
  TrailingCommaOnDeclarationSite:
    active: true
  ImportOrdering:
    active: false
  MaximumLineLength:
    active: false
  MultiLineIfElse:
    active: false
  Indentation:
    indentSize: 4
  ParameterListWrapping:
    active: false
  ArgumentListWrapping:
    indentSize: 4
    maxLineLength: 150
  KdocWrapping:
    active: true
    indentSize: 4
  Wrapping:
    indentSize: 4
    active: false
  CommentWrapping:
    active: false
  Filename:
    active: false
  PackageName:
    active: false
  AnnotationOnSeparateLine:
    active: false

style:
  MagicNumber:
    active: false
    ignoreAnnotated: [ 'AllowMagicNumber' ]
  ForbiddenComment:
    active: false
  UnusedPrivateMember:
    ignoreAnnotated: [ 'Preview', 'ComponentPreview', 'DevicePreview' ]
  ThrowsCount:
    active: false
  ReturnCount:
    active: false
  LoopWithTooManyJumpStatements:
    active: false
  DestructuringDeclarationWithTooManyEntries:
    active: false
  MaxLineLength:
    active: false

naming:
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'
  FunctionNaming:
    ignoreAnnotated: [ 'Composable' ]
  MatchingDeclarationName:
    active: false
  VariableNaming:
    active: false
  PackageNaming:
    packagePattern: '[a-z]+(\._?[_?A-Za-z0-9]*)*'
  MemberNameEqualsClassName:
    excludes: [ '**/core/ui/**/LocalHazeState.kt' ]

exceptions:
  TooGenericExceptionCaught:
    excludes: [ '**/feature/mypage/**/MyPageViewModel.kt', '**/core/network/**/ErrorTrackingInterceptor.kt', '**/messaging/RoomiFirebaseMessagingService.kt', '**/core/datastore/**/TokenPreferences.kt' ]
  SwallowedException:
    excludes: [ '**/core/datastore/**/TokenPreferences.kt' ]
